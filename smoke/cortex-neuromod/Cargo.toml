[package]
name = "hybrid-fusion-cortex-neuromod-smoke"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.0"
publish = false
description = "Fixed-seed smoke harness: one cortex-tensor embedding stage into NeuromodSnn (issue #45), plus cross-crate SNN step-contract parity tests (RM-2360)."
license = "MIT OR Apache-2.0"

# Not a workspace member of the library root. An empty `[workspace]` table
# (below) is what actually detaches it: a nested package under a `[workspace]`
# root is rejected unless it is a member, listed in `exclude`, or has its own
# `[workspace]` table. Cargo resolves a package's lockfile as if every feature
# were enabled, so a git dependency — even an optional one — on hybrid-fusion
# would make a clean `cargo test --offline` fetch GitHub and would make
# `cargo publish` fail. This package owns that pin instead. `publish = false`
# keeps it out of crates.io.

[workspace]

[dependencies]
hybrid-fusion = { path = "../..", features = ["neuromod"] }
# cortex-tensor 0.1.0 is not on crates.io (index 404 as of 2026-10-02).
# Authorized by issue #45 as a test-only harness, not a library dependency.
# The `neuromod` feature turns on `snn::NeuromodNetwork` for the parity
# tests; it pulls the same published neuromod 0.7 both crates already use.
# Pinned past the engram-backed MoE + SNN fix series (#91/#92/#93, PRs
# #131/#145): `NeuromodNetwork::with_seed`, `step_frozen`, the additive spike
# boost, and the bounded hidden gain all exist at this rev, so the parity
# tests in tests/snn_contract_parity.rs can compare like with like. The old
# `5cbee81` pin predates those fixes (RM-2208's bump, unblocked by RM-2360).
cortex-tensor = { git = "https://github.com/rmems/cortex-tensor", rev = "f591f2efd298e920250dd6cfdbf6056ea9368257", features = [
    "neuromod",
] }
# Direct test-only dependency for the parity tests: constructing a blank
# `neuromod::SpikingNetwork` proves cortex-tensor's public #91 rejection.
# Resolves to the same published neuromod 0.7 both crates already depend on.
neuromod = "0.7"
