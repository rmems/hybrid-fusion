[package]
name = "hybrid-fusion-cortex-neuromod-smoke"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.0"
publish = false
description = "Fixed-seed smoke harness: cortex-hybrid ANN stages into NeuromodSnn (issue #45), cross-crate SNN step-contract parity tests (RM-2360), and a cortex-only ANN→SNN→ANN round trip (RM-2208)."
license = "MIT OR Apache-2.0"

# Not a workspace member of the library root. An empty `[workspace]` table
# (below) is what actually detaches it: a nested package under a `[workspace]`
# root is rejected unless it is a member, listed in `exclude`, or has its own
# `[workspace]` table. Cargo resolves a package's lockfile as if every feature
# were enabled, so a git dependency — even an optional one — on hybrid-fusion
# would make a clean `cargo test --offline` fetch GitHub and would make
# `cargo publish` fail. This package owns that pin instead. `publish = false`
# keeps it out of crates.io.

[workspace]

[dependencies]
hybrid-fusion = { path = "../..", features = ["neuromod", "axon-encoder"] }
# Published cortex-hybrid 0.2.0 (crates.io, verified 2026-11-25) provides the
# ANN stage executor plus the `snn` contract used by this test-only harness.
cortex-hybrid = { version = "0.2", features = ["neuromod", "axon-encoder"] }
# Direct test-only dependency for the encoder-adapter parity test: both
# crates' axon adapters wrap the same published axon-encoder 0.6 Encoder
# type, so constructing encoders here feeds identical instances to each side.
axon-encoder = "0.6"
# Direct test-only dependency for the parity tests: constructing a blank
# `neuromod::SpikingNetwork` proves cortex-hybrid's public #91 rejection.
# Resolves to the same published neuromod 0.7 both crates already depend on.
neuromod = "0.7"

[dev-dependencies]
serde_json = "1.0"
