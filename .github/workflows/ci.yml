name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (lint)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-features

      - name: Test
        run: cargo test --all-features

  msrv:
    name: MSRV (1.98.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537
        with:
          toolchain: 1.98.1

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (default)
        run: cargo build

      - name: Test (default)
        run: cargo test

      - name: Build (neuromod)
        run: cargo build --features neuromod

      - name: Test (neuromod)
        run: cargo test --features neuromod

      # Cover the pure-flag `backends` combos on the MSRV toolchain. These pull
      # no extra crates, so they exercise the feature combination without
      # coupling the MSRV gate to the sentry transitive tree (reqwest/hyper/
      # tokio/ring), which `--all-features` would.
      - name: Build (backends)
        run: cargo build --features backends

      - name: Test (backends)
        run: cargo test --features backends

      - name: Build (neuromod + backends)
        run: cargo build --features "neuromod backends"

      - name: Test (neuromod + backends)
        run: cargo test --features "neuromod backends"
