[package]
name = "hybrid-fusion"
version = "0.3.0"
edition = "2024"
rust-version = "1.98.1"
description = "Backend-agnostic pure-Rust orchestrator for hybrid transformer <-> spiking neural network stacks. Trait-based, zero external math dependencies."
repository = "https://github.com/rmems/hybrid-fusion"
license = "MIT OR Apache-2.0"
keywords = ["neuromorphic", "snn", "llm", "transformer", "hybrid"]
categories = ["science", "algorithms"]
readme = "README.md"
exclude = ["docs/"]

[lib]
name = "hybrid_fusion"
path = "src/lib.rs"

# ── Core pure-Rust stack ──────────────────────────────────────────────────────
[dependencies]

# ── Serialisation / Utility ────────────────────────────────────────────────────
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror  = "1.0"

# ── Optional: Sentry error reporting ──────────────────────────────────────────
# Enabling `sentry` pulls a sizable transitive tree (reqwest/hyper/tokio/ring).
# Prefer it only in service binaries; library default builds stay lean.
sentry = { version = "0.34", optional = true, default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }

# ── Optional: real SNN backend (neuromod) ─────────────────────────────────────
# Enabling `neuromod` pulls the neuromod 0.7 spiking engine (and its `rand`
# dependency). Off by default; the library's default build stays dependency-light.
#
# Dependency-boundary exception: REVIEW.md forbids concrete backend deps and
# AGENTS.md allows one only as a tracked, documented exception. This optional,
# off-by-default dependency IS that exception, authorized by issue #44
# (https://github.com/rmems/hybrid-fusion/issues/44). It is feature-gated so the
# default build stays trait-only/backend-agnostic, and no neuromod type appears
# in the public API; downstream crates remain the long-term home for concrete
# backends.
neuromod = { version = "0.7", optional = true }

# ── Optional: real ANN stage for the #45 smoke test ──────────────────────────
# cortex-tensor 0.1.0 is not on crates.io (index 404 as of 2026-10-02). Pinned
# to the main commit that exports ReferenceExecutor's embedding stage.
# Pulled only when `neuromod` / `cortex-smoke` is enabled, so `cargo test`
# with no features does not fetch it. Test-only: no cortex type is in the
# public API. Authorized by issue #45.
cortex-tensor = { git = "https://github.com/rmems/cortex-tensor", rev = "5cbee81473ed69bd8e74d53e210ef64c02d232da", optional = true }

[features]
default  = []
sentry   = ["dep:sentry"]
backends = []
neuromod = ["dep:neuromod"]
# Issue #45 smoke test. Implies `neuromod` and the pinned cortex-tensor git
# dependency. Not part of `default`, and not implied by `neuromod` alone, so
# `cargo test --features neuromod` stays free of the unpublished ANN crate.
# Run with `cargo test --features cortex-smoke`.
cortex-smoke = ["neuromod", "dep:cortex-tensor"]

[dev-dependencies]
serde_json = "1.0"
proptest   = "1"

[[example]]
name = "sentry_init"
required-features = ["sentry"]

[[example]]
name = "simple_hybrid"
required-features = ["backends"]

[[example]]
name = "hybrid_telemetry"

[[example]]
name = "neuromod_memory"
required-features = ["neuromod"]

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1

[workspace]
# Standalone: detach from any parent Cargo workspace (mirrors cortex-tensor).
