[package]
name = "hybrid-fusion"
version = "0.3.0"
edition = "2024"
# Development toolchain and MSRV are the same pin. Keep this equal to
# `rust-toolchain.toml` `channel`, `smoke/cortex-neuromod` `rust-version`,
# the CI MSRV job, and `.agents/setup`. The CI validate job stays on the
# `stable` channel.
rust-version = "1.99.0"
description = "Backend-agnostic pure-Rust orchestrator for hybrid transformer <-> spiking neural network stacks. Trait-based, zero external math dependencies."
repository = "https://github.com/rmems/hybrid-fusion"
license = "MIT OR Apache-2.0"
keywords = ["neuromorphic", "snn", "llm", "transformer", "hybrid"]
categories = ["science", "algorithms"]
readme = "README.md"
# crates.io surface: licenses, README, changelog, user docs, sources,
# examples, and tests. Drop agent/CI/dev-only paths and the separate
# smoke harness (it is a test-only package and must not be packaged).
# `docs/superpowers/` is agent planning history; `docs/implementing-backends.md`
# and `docs/extraction-map.md` stay. `rust-toolchain.toml` stays in git so
# local builds use the pinned toolchain; MSRV for dependents is `rust-version`.
exclude = [
    "/.agents/",
    "/.coderabbit.yaml",
    "/.github/",
    "/.gitignore",
    "/AGENTS.md",
    "/CLAUDE.md",
    "/REVIEW.md",
    "/docs/superpowers/",
    "/rust-toolchain.toml",
    "/smoke/",
]

[lib]
name = "hybrid_fusion"
path = "src/lib.rs"

# ── Core pure-Rust stack ──────────────────────────────────────────────────────
[dependencies]

# ── Serialisation / Utility ────────────────────────────────────────────────────
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror  = "1.0"

# ── Optional: real SNN backend (neuromod) ─────────────────────────────────────
# Enabling `neuromod` pulls the neuromod 0.7 spiking engine (and its `rand`
# dependency). Off by default; the library's default build stays dependency-light.
#
# Dependency-boundary exception: REVIEW.md forbids concrete backend deps and
# AGENTS.md allows one only as a tracked, documented exception. This optional,
# off-by-default dependency IS that exception, authorized by issue #44
# (https://github.com/rmems/hybrid-fusion/issues/44). It is feature-gated so the
# default build stays trait-only/backend-agnostic, and no neuromod type appears
# in the public API; downstream crates remain the long-term home for concrete
# backends.
neuromod = { version = "0.7", optional = true }

# ── Optional: axon-encoder sensory encoders ───────────────────────────────────
# `axon-encoder` owns sensory encoding in the rmems stack (see AGENTS.md's
# ownership table). The optional `axon-encoder` feature exposes
# `AxonEncoderAdapter`, a `DomainAdapter` backed by that crate's `Encoder`
# trait, so rate/temporal coding reaches hybrid pipelines without in-tree
# encoder implementations. Off by default; decoding stays in-tree.
axon-encoder = { version = "0.6", optional = true }

[features]
default  = []
backends = []
neuromod = ["dep:neuromod"]
axon-encoder = ["dep:axon-encoder"]

[dev-dependencies]
criterion  = "0.5"
serde_json = "1.0"
proptest   = "1"

[[bench]]
name = "routing"
harness = false

[[example]]
name = "simple_hybrid"
required-features = ["backends"]

[[example]]
name = "hybrid_telemetry"

[[example]]
name = "neuromod_memory"
required-features = ["neuromod"]

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1

[workspace]
# Standalone: detach from any parent Cargo workspace (mirrors cortex-tensor).
